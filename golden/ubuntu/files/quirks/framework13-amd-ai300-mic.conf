# Framework Laptop 13 (AMD Ryzen AI 300 Series): the ALSA UCM profiles expose the ACP digital
# mic, which records a constant full-scale value on this model, and hide the working Realtek
# ALC285 internal mic. Turning UCM off makes the ALC285 the default source.
# https://github.com/thesofproject/linux/issues/5944
monitor.alsa.properties = {
  alsa.use-ucm = false
}
