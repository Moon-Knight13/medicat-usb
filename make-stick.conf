# make-stick.conf — repeatable settings for sticks built from this repo.
# Sourced by make-stick.sh. Each line only sets a default, so an environment
# variable of the same name still wins for a one-off run.

: "${UBUNTU_LTS_ONLY:=1}"        # 1 = track LTS releases only (recommended for a rescue stick), 0 = newest release
: "${UBUNTU_FLAVOUR:=desktop}"   # desktop | server
: "${PARTITION_STYLE:=mbr}"      # mbr (boots BIOS + UEFI) | gpt
: "${STICK_TEST:=1}"             # 1 = run f3probe before writing (rejects counterfeit sticks), 0 = skip
